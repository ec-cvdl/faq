<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'">
  <title>Dépannage informatique</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main class="page">
    <header class="entete">
      <h1 id="titre">Dépannage informatique</h1>
      <p id="sous-titre"></p>
    </header>

    <section id="accueil" aria-labelledby="t-symptomes">
      <h2 id="t-symptomes" class="titre-section">Quel est le problème ?</h2>
      <label class="recherche">
        <span class="sr">Rechercher un problème</span>
        <input id="filtre" type="search" placeholder="Rechercher : écran, wifi, batterie…" autocomplete="off">
      </label>
      <div id="liste" class="liste" role="list"></div>
      <p class="aucun" id="aucun" hidden>Aucun problème ne correspond. Essayez « Autre problème ».</p>
    </section>

    <section id="parcours" class="dp-zone" hidden aria-live="polite"></section>

    <section id="contact" class="contact" hidden aria-labelledby="t-contact">
      <h2 id="t-contact" class="titre-section">Contacter le SAV Emmaüs Connect de votre région</h2>
      <label class="choix-region">
        <span>Votre région</span>
        <select id="region"></select>
      </label>
      <div id="fiche"></div>
      <p class="rappel" id="rappel"></p>
      <button type="button" class="btn btn-secondaire" id="retour-accueil">← Revenir à la liste des problèmes</button>
    </section>
  </main>
  <script src="app.js?v=1"></script>
</body>
</html>
