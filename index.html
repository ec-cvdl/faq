<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'">
  <title>Dépannage informatique</title>
  <link rel="stylesheet" href="design/cvdl-ui.css?v=1">
  <link rel="stylesheet" href="design/depannage.css?v=1">
  <link rel="stylesheet" href="site.css?v=1">
  <script src="design/illustrations.js?v=1"></script>
  <script src="design/illustrations-moteur.js?v=1"></script>
</head>
<body data-famille="sav">
<header class="cvdl-entete"><a class="cvdl-marque" href="#" aria-label="Retour à l’accueil"><img src="design/logo.png" alt="Emmaüs Connect" class="logo-portail" id="logo"></a></header>
<main id="contenu-principal">

  <!-- Accueil : choix du problème -->
  <section class="etape" id="accueil">
    <div class="etape-carte">
      <div class="cvdl-titre"><span data-ill="panne" class="pk-titre-ill xl"></span><div class="cvdl-titre-txt"><div class="cvdl-surtitre">Dépannage</div><h1 id="titre">Quel <em>problème</em> rencontrez-vous ?</h1><p class="site-sous-titre" id="sous-titre"></p></div></div>
      <div class="card elev-lg site-grille">
        <div class="grille-symptomes" id="liste"></div>
      </div>
    </div>
  </section>

  <!-- Parcours de dépannage -->
  <section class="etape dp-zone" id="parcours" hidden>
    <div class="etape-carte">
      <div class="dp-intro"><span data-ill="aide" class="ill s"></span><span><b>Essayons ensemble.</b> Quelques vérifications rapides règlent souvent le problème — pas besoin d’être un expert.</span></div>
      <div id="zone-depannage"></div>
    </div>
  </section>

</main>
<script src="app.js?v=3"></script>
